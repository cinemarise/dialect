[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cinemarise-dialect"
version = "0.1.0"
description = "把不同模型偏好的写法归类，标出迁移时需要改写的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "cinemarise" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://cinemarise.github.io"
Repository = "https://github.com/cinemarise/dialect"
Issues = "https://github.com/cinemarise/dialect/issues"

[project.scripts]
dialect = "dialect:main"

[tool.setuptools]
py-modules = ["dialect"]
